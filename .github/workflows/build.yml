# Host tests, release + debug .sprx builds, and GitHub releases on v* tags.
name: build

on:
  # Every push (any branch or tag) runs tests and builds; only v* tags release.
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # Same toolchain as ps5/Dockerfile and crates/ampr-zstd rust-version.
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  sprx:
    name: build sprx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            out/cargo-home/registry
            out/cargo-home/git
          key: sprx-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: sprx-cargo-
      - name: make dist (Docker)
        run: ./ps5/build-docker.sh dist
      - name: sha256
        run: sha256sum libSceAmpr.sprx libSceAmpr-debug.sprx | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sprx
          path: |
            libSceAmpr.sprx
            libSceAmpr-debug.sprx
            SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sprx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sprx
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            libSceAmpr.sprx libSceAmpr-debug.sprx SHA256SUMS

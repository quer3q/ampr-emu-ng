[package]
name = "ampr-pkg"
version = "0.3.5"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[features]
default = []
# `kraken::Scratch::new_boxed`: a zeroed heap Scratch without a stack temporary.
alloc = []
# `kraken::phase`: cycle counters per decode phase (rdtsc / cntvct_el0), profiling only.
phase_timing = []

[dependencies]
# The AMPRPAK4 manifest reader that pkg mode validates with its own rules.
ampr-lz4 = { path = "../ampr-lz4" }
# `Source`, so `open_pkg` validates a paged index as `Manifest::open` does.
ampr-format = { path = "../ampr-format" }
